upstream pos_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name 206.81.5.94;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Bloquear acceso a dotfiles (.env, .git, etc.) — escaneos de bots
    location ~ /\. {
        deny all;
        return 404;
    }

    # Admin panel (archivos estáticos)
    root /root/SistemaPOS/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Actualizaciones automáticas del POS
    location /updates {
        alias /var/www/updates;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        location ~* \.(exe|yml|yaml|blockmap)$ {
            add_header Content-Disposition "attachment";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Endpoints de administración de licencias — rate limit estricto
    location /api/licencias/admin/ {
        limit_req zone=api_admin burst=3 nodelay;
        proxy_pass         http://pos_api/licencias/admin/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API general al backend
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass         http://pos_api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
